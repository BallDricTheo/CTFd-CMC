<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #007bff;
        }
        input, button {
            margin: 10px;
            padding: 8px;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Magic Calculator</h1>
    <p>This calculator multiplies two numbers. Find the two numbers that reveal the secret when multiplied.</p>
    <p>Enter two numbers and see what happens. The result might unlock something special.</p>

    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">
    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <script>
        function calculate() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);

            const result = num1 * num2;

            document.getElementById('result').innerText = `Result: ${result}`;

            // If the result is the magic number, log obfuscated flag to console
            if (result === 42) {
                console.log(atob('ZmxhZ3s=') + atob('ajR2NHNjcjFwdF8=') + atob('bTRuMXB1bDR0MTBu') + atob('fQ=='));
            }
        }
    </script>
</body>
</html>
